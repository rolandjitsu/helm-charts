name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # kubeconform release used to validate rendered manifests against the Kubernetes schemas.
  KUBECONFORM_VERSION: v0.6.7

jobs:
  lint:
    name: Lint and validate charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint, render, and validate every chart
        shell: bash
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            echo "::group::${chart}"
            helm lint "$chart"
            # Render under a few value combinations so the conditional templates
            # (Ingress, StorageClass) are all exercised, then validate each render
            # against the Kubernetes schemas. -strict rejects unknown fields.
            for args in \
              "" \
              "--set ingress.enabled=true" \
              "--set storage.createStorageClass=true"; do
              echo "-- helm template $chart $args"
              helm template release "$chart" $args \
                | kubeconform -strict -summary -ignore-missing-schemas
            done
            echo "::endgroup::"
          done

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Dependabot commit messages are auto-generated and can exceed the length
      # rules. Exempt them (keyed on PR author so maintainer re-runs stay stable);
      # the job still runs green.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: crate-ci/committed@v1.1.11
