apiVersion: v2
name: bazelremote
description: Sharded, highly available bazel-remote cache with an HAProxy consistent-hash router.
type: application
# Chart version; bumped on every release by knope. Independent of appVersion.
version: 0.1.1
# The bazel-remote release this chart deploys by default. Tracks upstream; bumped
# manually when moving to a newer bazel-remote (see README).
appVersion: "v2.6.1"
home: https://github.com/rolandjitsu/helm-charts/tree/main/charts/bazelremote
sources:
  - https://github.com/rolandjitsu/helm-charts
  - https://github.com/buchgr/bazel-remote
keywords:
  - bazel
  - bazel-remote
  - remote-cache
  - build-cache
  - sharding
  - haproxy
maintainers:
  - name: Roland Groza
    url: https://github.com/rolandjitsu
