{{- if .Values.ingress.enabled }}
# Optional standard Ingress in front of the public Service. For a non-standard
# controller (e.g. a Traefik IngressRoute CRD), leave ingress.enabled=false and
# manage the route as a separate manifest.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: '{{ include "bazelremote.fullname" . }}'
  labels:
    app: '{{ include "bazelremote.haproxyName" . }}'
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: '{{ include "bazelremote.fullname" . }}'
                port:
                  number: {{ .Values.service.port }}
{{- end }}
