# Local git hooks, managed by prek (https://github.com/j178/prek) - a fast, Rust,
# no-Python reimplementation of pre-commit. Enable once with: prek install
#
# Mirrors CI where it's cheap: typos + Conventional Commits on commit, and a helm
# lint of any changed chart on commit.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        # Lint every chart when any chart file changes. helm lint takes a chart
        # directory, not file paths, so filenames are not passed through.
        entry: bash -c 'for c in charts/*/; do helm lint "$c" || exit 1; done'
        language: system
        files: ^charts/
        pass_filenames: false
        stages: [pre-commit]
